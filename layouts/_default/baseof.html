<!doctype html>
<html lang="{{ site.Language.LanguageCode | default "en" }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0d14">
  <meta name="description" content="{{ .Description | default site.Params.tagline }}">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ "css/site.css" | relURL }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.Title }}" href="{{ "index.xml" | relURL }}">
</head>
<body>
  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>
  <header class="topbar">
    <a class="brand" href="{{ site.Home.RelPermalink }}">
      <span class="brand-mark">OC</span>
      <span>Overlay<span class="brand-light">Composer</span></span>
    </a>
    <nav>
      <a href="{{ "releases/" | relURL }}">Releases</a>
      <a class="nav-github" href="{{ site.Params.projectRepository }}" target="_blank" rel="noreferrer">GitHub <span aria-hidden="true">↗</span></a>
    </nav>
  </header>
  <main>
    {{ block "main" . }}{{ end }}
  </main>
  <footer class="footer">
    <span>© {{ now.Year }} OverlayComposer</span>
    <span>Built with <a href="https://gohugo.io/" target="_blank" rel="noreferrer">Hugo</a> · <a href="{{ site.Params.projectRepository }}" target="_blank" rel="noreferrer">Source on GitHub ↗</a></span>
  </footer>
</body>
</html>

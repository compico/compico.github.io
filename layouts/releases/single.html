{{ define "main" }}
<article class="article">
  <a class="back-link" href="{{ "releases/" | relURL }}">← All releases</a>
  <header class="article-header">
    <div class="release-meta"><span class="release-tag">{{ .Params.version | default "UPDATE" }}</span><time>{{ .Date.Format "January 02, 2006" }}</time></div>
    <h1>{{ .Title }}</h1>
    {{ with .Params.summary }}<p class="article-summary">{{ . }}</p>{{ end }}
  </header>
  <div class="article-body">{{ .Content }}</div>
  <div class="article-end"><span>END OF RELEASE NOTES</span><a href="{{ site.Params.projectRepository }}" target="_blank" rel="noreferrer">Project on GitHub ↗</a></div>
</article>
{{ end }}
